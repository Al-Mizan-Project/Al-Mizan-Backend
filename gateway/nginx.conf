upstream auth_backend {
  server ${AUTH_UPSTREAM};
  keepalive ${AUTH_UPSTREAM_KEEPALIVE};
}

upstream acteurs_backend {
  server ${ACTEURS_UPSTREAM};
  keepalive ${ACTEURS_UPSTREAM_KEEPALIVE};
}

server {
  listen 80;
  server_tokens off;
  keepalive_timeout ${KEEPALIVE_TIMEOUT};
  client_max_body_size ${CLIENT_MAX_BODY_SIZE};

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/json application/*+json;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout ${PROXY_CONNECT_TIMEOUT};
  proxy_send_timeout ${PROXY_SEND_TIMEOUT};
  proxy_read_timeout ${PROXY_READ_TIMEOUT};
  proxy_buffering on;
  proxy_buffers 32 16k;
  proxy_busy_buffers_size 64k;

  location /auth/ {
    proxy_pass http://auth_backend/;
  }

  location /acteurs/ {
    proxy_pass http://acteurs_backend/;
  }
}

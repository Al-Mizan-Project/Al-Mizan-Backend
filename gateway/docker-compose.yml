services:
  nginx_gateway:
    image: nginx:1.27-alpine
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-host.docker.internal:18080}
      ACTEURS_UPSTREAM: ${ACTEURS_UPSTREAM:-host.docker.internal:18081}
      CONTRATS_UPSTREAM: ${CONTRATS_UPSTREAM:-host.docker.internal:18085}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-20m}
      KEEPALIVE_TIMEOUT: ${KEEPALIVE_TIMEOUT:-65}
      AUTH_UPSTREAM_KEEPALIVE: ${AUTH_UPSTREAM_KEEPALIVE:-64}
      ACTEURS_UPSTREAM_KEEPALIVE: ${ACTEURS_UPSTREAM_KEEPALIVE:-64}
      CONTRATS_UPSTREAM_KEEPALIVE: ${CONTRATS_UPSTREAM_KEEPALIVE:-64}
      PROXY_CONNECT_TIMEOUT: ${PROXY_CONNECT_TIMEOUT:-5s}
      PROXY_SEND_TIMEOUT: ${PROXY_SEND_TIMEOUT:-60s}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-60s}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

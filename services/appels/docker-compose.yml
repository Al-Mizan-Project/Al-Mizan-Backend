services:
  appels_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-pgbouncer_appels}
      DB_PORT: ${DB_PORT:-6432}
    ports:
      - "${APPELS_API_PORT:-18083}:8000"
    depends_on:
      appels_db:
        condition: service_healthy
      pgbouncer_appels:
        condition: service_healthy
      redis_appels:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appels-net

  appels_db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-appels_db}
      POSTGRES_USER: ${DB_USER:-appels_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appels_password}
    volumes:
      - appels-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appels_user} -d ${DB_NAME:-appels_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appels-net

  pgbouncer_appels:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: appels_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appels_db}
      DB_USER: ${DB_USER:-appels_user}
      DB_PASSWORD: ${DB_PASSWORD:-appels_password}
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      appels_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PGBOUNCER_PORT:-6432} -U ${DB_USER:-appels_user} -d ${DB_NAME:-appels_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appels-net

  redis_appels:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-appels_redis_password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-appels_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appels-net

volumes:
  appels-db-data:

networks:
  appels-net:
    driver: bridge

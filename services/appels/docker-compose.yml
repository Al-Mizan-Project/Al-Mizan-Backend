# Appels Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  appels_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-appels_db}
      DB_USER: ${DB_USER:-appels_user}
      DB_PASSWORD: ${DB_PASSWORD:-appels_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/2}
    ports:
      - "${APPELS_API_PORT:-18083}:8000"
    restart: unless-stopped
    networks:
      - appels-net

networks:
  appels-net:
    driver: bridge

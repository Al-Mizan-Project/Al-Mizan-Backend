# Evaluations Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  evaluations_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-evaluations_db}
      DB_USER: ${DB_USER:-evaluations_user}
      DB_PASSWORD: ${DB_PASSWORD:-evaluations_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/5}
    restart: unless-stopped
    networks:
      - evaluations-net

  evaluations_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - evaluations_api
    ports:
      - "${EVALUATIONS_NGINX_PORT:-18086}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - evaluations-net

networks:
  evaluations-net:
    driver: bridge

# Contractant Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  contractant_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-contractant_db}
      DB_USER: ${DB_USER:-contractant_user}
      DB_PASSWORD: ${DB_PASSWORD:-contractant_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/4}
    ports:
      - "${CONTRACTANT_API_PORT:-18082}:8000"
    restart: unless-stopped
    networks:
      - contractant-net

networks:
  contractant-net:
    driver: bridge

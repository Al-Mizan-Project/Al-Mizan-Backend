services:
  contractant_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-pgbouncer_contractant}
      DB_PORT: ${DB_PORT:-6432}
    ports:
      - "${CONTRACTANT_API_PORT:-18082}:8000"
    depends_on:
      contractant_db:
        condition: service_healthy
      pgbouncer_contractant:
        condition: service_healthy
      redis_contractant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contractant-net

  contractant_db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-contractant_db}
      POSTGRES_USER: ${DB_USER:-contractant_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contractant_password}
    volumes:
      - contractant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contractant_user} -d ${DB_NAME:-contractant_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contractant-net

  pgbouncer_contractant:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: contractant_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-contractant_db}
      DB_USER: ${DB_USER:-contractant_user}
      DB_PASSWORD: ${DB_PASSWORD:-contractant_password}
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      contractant_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PGBOUNCER_PORT:-6432} -U ${DB_USER:-contractant_user} -d ${DB_NAME:-contractant_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contractant-net

  redis_contractant:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-contractant_redis_password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-contractant_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contractant-net

volumes:
  contractant-db-data:

networks:
  contractant-net:
    driver: bridge

# Acteurs Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  acteurs_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-acteurs_db}
      DB_USER: ${DB_USER:-acteurs_user}
      DB_PASSWORD: ${DB_PASSWORD:-acteurs_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/1}
    restart: unless-stopped
    networks:
      - acteurs-net

  acteurs_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - acteurs_api
    ports:
      - "${ACTEURS_NGINX_PORT:-18081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - acteurs-net

networks:
  acteurs-net:
    driver: bridge

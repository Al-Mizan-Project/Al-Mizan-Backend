services:
  acteurs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acteurs-api
    env_file:
      - .env
    environment:
      DB_HOST: acteurs-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT}
    depends_on:
      acteurs-db:
        condition: service_healthy
      acteurs-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acteurs-net

  acteurs-db:
    image: postgres:16-alpine
    container_name: acteurs-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - acteurs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - acteurs-net

  acteurs-redis:
    image: redis:7.4-alpine
    container_name: acteurs-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - acteurs-net

  acteurs-nginx:
    image: nginx:1.27-alpine
    container_name: acteurs-nginx
    depends_on:
      - acteurs-api
    ports:
      - "${ACTEURS_NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - acteurs-net

volumes:
  acteurs-db-data:

networks:
  acteurs-net:
    driver: bridge

version: "3.8"

services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    environment:
      - DJANGO_ENV=development
      - DATABASE_URL=postgres://documents_user:documents_password@pgbouncer_documents:5432/documents_db
      - REDIS_URL=redis://redis_documents:6379/1
      - MINIO_URL=http://minio_documents:9000
      - MINIO_ACCESS_KEY=admin_almizan
      - MINIO_SECRET_KEY=SecurePassword123!
      - MINIO_BUCKET_NAME=almizan-documents
      - SECRET_KEY=unsafe-dev-secret
    depends_on:
      pgbouncer_documents:
        condition: service_started
      redis_documents:
        condition: service_started
      minio_documents:
        condition: service_started
    command: >
      sh -c "./entrypoint.sh && python manage.py runserver 0.0.0.0:8000"

  db_documents:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=documents_db
      - POSTGRES_USER=documents_user
      - POSTGRES_PASSWORD=documents_password
    ports:
      - "5433:5432"
    volumes:
      - documents_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents_user -d documents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_documents:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://documents_user:documents_password@db_documents:5432/documents_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=scram-sha-256
    depends_on:
      db_documents:
        condition: service_healthy

  redis_documents:
    image: redis:7-alpine
    volumes:
      - documents_redis_data:/data

  minio_documents:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin_almizan
      MINIO_ROOT_PASSWORD: SecurePassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - documents_minio_data:/data
    command: server /data --console-address ":9001"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db_documents

  create_bucket:
    image: minio/mc:latest
    depends_on:
      - minio_documents
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio_documents:9000 admin_almizan SecurePassword123!;
      /usr/bin/mc mb myminio/almizan-documents || true;
      /usr/bin/mc anonymous set download myminio/almizan-documents;
      exit 0;
      "

volumes:
  documents_pg_data:
  documents_redis_data:
  documents_minio_data:

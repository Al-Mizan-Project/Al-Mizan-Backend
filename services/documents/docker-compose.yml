# Documents Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  api:
    build: .
    entrypoint: ["sh", "-c"]
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    environment:
      - DJANGO_ENV=development
      - DATABASE_URL=postgres://documents_user:documents_password@host.docker.internal:5432/documents_db
      - REDIS_URL=redis://:almizan_redis_password@host.docker.internal:6379/8
      - MINIO_URL=http://minio-documents:9000
      - MINIO_ACCESS_KEY=admin_almizan
      - MINIO_SECRET_KEY=SecurePassword123!
      - MINIO_BUCKET_NAME=almizan-documents
      - SECRET_KEY=unsafe-dev-secret
    depends_on:
      minio_documents:
        condition: service_started
    command: >
      "sh /app/entrypoint.sh && python manage.py runserver 0.0.0.0:8000"

  minio_documents:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin_almizan
      MINIO_ROOT_PASSWORD: SecurePassword123!
    networks:
      default:
        aliases:
          - minio-documents
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - documents_minio_data:/data
    command: server /data --console-address ":9001"

  create_bucket:
    image: minio/mc:latest
    depends_on:
      - minio_documents
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio-documents:9000 admin_almizan SecurePassword123!; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/almizan-documents --ignore-existing;
      /usr/bin/mc anonymous set download myminio/almizan-documents || true;
      exit 0;
      "

volumes:
  documents_minio_data:

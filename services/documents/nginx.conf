upstream documents_api {
    server api:8000;
}

server {
    listen 80;
    server_tokens off;

    location / {
        proxy_pass http://documents_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}

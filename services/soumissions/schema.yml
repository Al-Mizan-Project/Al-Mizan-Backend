      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/soumissions/:
    post:
      operationId: soumissions_create
      description: Dépôt d'une offre financière chiffrée
      tags:
      - soumissions
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Soumission déposée
  /api/soumissions/{id_appel_offre}/open-bids/:
    post:
      operationId: soumissions_open_bids_create
      description: Cérémonie d'ouverture des plis et déchiffrement E2EE
      parameters:
      - in: path
        name: id_appel_offre
        schema:
          type: integer
        required: true
      tags:
      - soumissions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Plis ouverts
        '404':
          description: Aucune soumission
  /api/soumissions/{soumission_id}/evaluate/:
    post:
      operationId: soumissions_evaluate_create
      description: Attribution d'une note par un membre de la commission
      parameters:
      - in: path
        name: soumission_id
        schema:
          type: integer
        required: true
      tags:
      - soumissions
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Évaluation enregistrée
components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

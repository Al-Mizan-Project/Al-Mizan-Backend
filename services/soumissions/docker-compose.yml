# Soumissions Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "8004:8000"
    environment:
      - DJANGO_ENV=development
      - DATABASE_URL=postgres://soumissions_user:soumissions_password@host.docker.internal:5432/soumissions_db
      - REDIS_URL=redis://:almizan_redis_password@host.docker.internal:6379/9
      - SECRET_KEY=unsafe-dev-secret-soumissions
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
    command: >
      sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

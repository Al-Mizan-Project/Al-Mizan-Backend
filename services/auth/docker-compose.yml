services:
  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-pgbouncer_auth}
      DB_PORT: ${DB_PORT:-6432}
    depends_on:
      auth_db:
        condition: service_healthy
      pgbouncer_auth:
        condition: service_healthy
      redis_auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-net

  auth_db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-auth_db}
      POSTGRES_USER: ${DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth_password}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auth_user} -d ${DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - auth-net

  pgbouncer_auth:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: auth_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-auth_db}
      DB_USER: ${DB_USER:-auth_user}
      DB_PASSWORD: ${DB_PASSWORD:-auth_password}
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      auth_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PGBOUNCER_PORT:-6432} -U ${DB_USER:-auth_user} -d ${DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - auth-net

  redis_auth:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-auth_redis_password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-auth_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - auth-net

  auth_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - auth_api
    ports:
      - "${AUTH_NGINX_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - auth-net

volumes:
  auth-db-data:

networks:
  auth-net:
    driver: bridge

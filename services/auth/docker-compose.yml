# Auth Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-auth_db}
      DB_USER: ${DB_USER:-auth_user}
      DB_PASSWORD: ${DB_PASSWORD:-auth_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/0}
    restart: unless-stopped
    networks:
      - auth-net

  auth_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - auth_api
    ports:
      - "${AUTH_NGINX_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - auth-net

networks:
  auth-net:
    driver: bridge

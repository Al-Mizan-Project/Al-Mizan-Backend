# Audit Service (Event Sourcing with Kafka + Debezium CDC)
# Requires shared infrastructure: docker compose -f ../../infrastructure/docker-compose.yml up -d
# Uses shared PostgreSQL (port 5433) with audit_ledger and audit_read databases

services:
  web:
    build: .
    container_name: django-audit
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - REDIS_URL=redis://:almizan_redis_password@host.docker.internal:6379/10
      - DB_HOST=host.docker.internal
      - DB_PORT=5433
      - DB_LEDGER_USER=audit_user
      - DB_LEDGER_PASSWORD=audit_password
      - DB_LEDGER_NAME=audit_ledger
      - DB_READ_USER=audit_user
      - DB_READ_PASSWORD=audit_password
      - DB_READ_NAME=audit_read
    networks:
      - audit-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - audit-network
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - audit-network

  connect:
    image: debezium/connect:2.5.0.Final
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - audit-network
    depends_on:
      - kafka

  projection-consumer:
    build:
      context: ./projection-consumer
    container_name: projection-consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
      KAFKA_TOPIC:             'outbox.event.AuditLog'
      CONSUMER_GROUP_ID:       'audit-projection-consumer'
      PYTHONPATH: '/app'
      DJANGO_SETTINGS_MODULE:  'config.settings' 
      DB_LEDGER_HOST: 'host.docker.internal'
      DB_LEDGER_PORT: '5433'
      DB_READ_HOST:   'host.docker.internal'
      DB_READ_PORT:   '5433'
      DB_USER: 'audit_user'
      DB_PASSWORD: 'audit_password'
      DB_LEDGER_NAME: 'audit_ledger'
      DB_READ_NAME: 'audit_read'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: python -u /app/projection-consumer/consumer.py
    networks:
      - audit-network
    restart: unless-stopped

networks:
  audit-network:
    driver: bridge
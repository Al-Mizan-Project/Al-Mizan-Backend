# Audit Service (Event Sourcing with Kafka + Debezium CDC)
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d
# Note: This service uses Kafka for event streaming, not the shared PostgreSQL

services:
  db:
    image: postgres-logical:15
    container_name: postgres-ledger
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit-network
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "listen_addresses=*"]

  web:
    build: .
    container_name: django-audit
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - REDIS_URL=redis://:almizan_redis_password@host.docker.internal:6379/10
    depends_on:
      - db
    networks:
      - audit-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - audit-network
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - audit-network

  connect:
    image: debezium/connect:2.5.0.Final
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
    networks:
      - audit-network
    depends_on:
      - kafka
      - db

  projection-consumer:
    build:
      context: ./projection-consumer
    container_name: projection-consumer
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:9092'
      KAFKA_TOPIC:             'outbox.event.AuditLog'
      CONSUMER_GROUP_ID:       'audit-projection-consumer'
      PYTHONPATH: '/app'
      DJANGO_SETTINGS_MODULE:  'config.settings' 
      DB_LEDGER_HOST: 'db'
      DB_LEDGER_PORT: '5432'
      DB_READ_HOST:   'db'
      DB_READ_PORT:   '5432'
      DB_USER: 'ledger_user'
      DB_PASSWORD: 'ledger_pass'
      DB_LEDGER_NAME: 'ledger'
      DB_READ_NAME: 'read_db'
    volumes:
      - .:/app
    command: python -u /app/projection-consumer/consumer.py
    networks:
      - audit-network
    restart: unless-stopped

networks:
  audit-network:
    driver: bridge
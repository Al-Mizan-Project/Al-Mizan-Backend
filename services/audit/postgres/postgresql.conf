# REQUIRED: Enable logical replication decoding.
# 'logical' means changes are decoded to SQL-level events (row-based).
# Default is 'replica' which only supports streaming replication.
wal_level = logical
 
# Maximum number of replication slots.
# Each Debezium connector consumes ONE slot.
# Never set this to 0 or your connector will fail.
max_replication_slots = 4
 
# Maximum WAL senders (concurrent replication connections).
# One per connector + headroom.
max_wal_senders = 4
 
# WAL sender timeout. Set to 0 to disable timeout (local dev only).
# In production, use a reasonable value like '60s'.
wal_sender_timeout = 0
 
# How long idle replication connections are kept alive.
wal_keep_size = 1024
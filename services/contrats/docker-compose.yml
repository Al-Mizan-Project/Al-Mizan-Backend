# Contrats Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  contrats_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-contrats_db}
      DB_USER: ${DB_USER:-contrats_user}
      DB_PASSWORD: ${DB_PASSWORD:-contrats_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/3}
    restart: unless-stopped
    networks:
      - contrats-net

  contrats_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - contrats_api
    ports:
      - "${CONTRATS_NGINX_PORT:-18085}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - contrats-net

networks:
  contrats-net:
    driver: bridge

services:
  contrats-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contrats-api
    env_file:
      - .env
    environment:
      DB_HOST: contrats-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT}
      SOUMISSIONS_SERVICE_URL: ${SOUMISSIONS_SERVICE_URL:-}
      CONTRACTANT_SERVICE_URL: ${CONTRACTANT_SERVICE_URL:-}
      ACTEURS_SERVICE_URL: ${ACTEURS_SERVICE_URL:-}
      DOCUMENTS_SERVICE_URL: ${DOCUMENTS_SERVICE_URL:-}
      REMOTE_SERVICE_TIMEOUT: ${REMOTE_SERVICE_TIMEOUT:-3}
    depends_on:
      contrats-db:
        condition: service_healthy
      contrats-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contrats-net

  contrats-db:
    image: postgres:16-alpine
    container_name: contrats-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - contrats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contrats-net

  contrats-redis:
    image: redis:7.4-alpine
    container_name: contrats-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contrats-net

  contrats-nginx:
    image: nginx:1.27-alpine
    container_name: contrats-nginx
    depends_on:
      - contrats-api
    ports:
      - "${CONTRATS_NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - contrats-net

volumes:
  contrats-db-data:

networks:
  contrats-net:
    driver: bridge

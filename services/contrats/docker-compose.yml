services:
  contrats_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-pgbouncer_contrats}
      DB_PORT: ${DB_PORT:-6432}
    depends_on:
      contrats_db:
        condition: service_healthy
      pgbouncer_contrats:
        condition: service_healthy
      redis_contrats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - contrats-net

  contrats_db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-contrats_db}
      POSTGRES_USER: ${DB_USER:-contrats_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contrats_password}
    volumes:
      - contrats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contrats_user} -d ${DB_NAME:-contrats_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contrats-net

  pgbouncer_contrats:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: contrats_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-contrats_db}
      DB_USER: ${DB_USER:-contrats_user}
      DB_PASSWORD: ${DB_PASSWORD:-contrats_password}
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      contrats_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PGBOUNCER_PORT:-6432} -U ${DB_USER:-contrats_user} -d ${DB_NAME:-contrats_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contrats-net

  redis_contrats:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-contrats_redis_password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-contrats_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - contrats-net

  contrats_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - contrats_api
    ports:
      - "${CONTRATS_NGINX_PORT:-18085}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - contrats-net

volumes:
  contrats-db-data:

networks:
  contrats-net:
    driver: bridge

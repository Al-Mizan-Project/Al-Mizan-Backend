services:
  notifications_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-pgbouncer_notifications}
      DB_PORT: ${DB_PORT:-6432}
    depends_on:
      notifications_db:
        condition: service_healthy
      pgbouncer_notifications:
        condition: service_healthy
      redis_notifications:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - notifications-net

  notifications_db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-notifications_db}
      POSTGRES_USER: ${DB_USER:-notifications_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notifications_password}
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notifications_user} -d ${DB_NAME:-notifications_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - notifications-net

  pgbouncer_notifications:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: notifications_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-notifications_db}
      DB_USER: ${DB_USER:-notifications_user}
      DB_PASSWORD: ${DB_PASSWORD:-notifications_password}
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      notifications_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PGBOUNCER_PORT:-6432} -U ${DB_USER:-notifications_user} -d ${DB_NAME:-notifications_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - notifications-net

  redis_notifications:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - notifications-net

  notifications_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - notifications_api
    ports:
      - "${NOTIFICATIONS_NGINX_PORT:-18087}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - notifications-net

volumes:
  notifications-db-data:

networks:
  notifications-net:
    driver: bridge

# Notifications Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  notifications_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-notifications_db}
      DB_USER: ${DB_USER:-notifications_user}
      DB_PASSWORD: ${DB_PASSWORD:-notifications_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/6}
    restart: unless-stopped
    networks:
      - notifications-net

  notifications_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - notifications_api
    ports:
      - "${NOTIFICATIONS_NGINX_PORT:-18087}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - notifications-net

networks:
  notifications-net:
    driver: bridge

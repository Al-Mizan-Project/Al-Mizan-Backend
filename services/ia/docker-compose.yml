# IA Service
# Requires shared infrastructure: docker compose -f infrastructure/docker-compose.yml up -d

services:
  ia_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ia_db}
      DB_USER: ${DB_USER:-ia_user}
      DB_PASSWORD: ${DB_PASSWORD:-ia_password}
      REDIS_URL: ${REDIS_URL:-redis://:almizan_redis_password@host.docker.internal:6379/7}
    restart: unless-stopped
    networks:
      - ia-net

  ia_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - ia_api
    ports:
      - "${IA_NGINX_PORT:-18088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - ia-net

networks:
  ia-net:
    driver: bridge
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-almizan_db}
      POSTGRES_USER: ${POSTGRES_USER:-almizan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almizan_user} -d ${POSTGRES_DB:-almizan_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-almizan_redis_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-almizan_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin_almizan}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-SecurePassword123!}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  create_bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-admin_almizan} ${MINIO_SECRET_KEY:-SecurePassword123!}; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-almizan-documents} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-almizan-documents} || true;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ../backend:/app
    environment:
      PORT: 8000
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-unsafe-dev-secret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-almizan_db}
      DB_USER: ${POSTGRES_USER:-almizan_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      DB_LEDGER_NAME: ${POSTGRES_DB:-almizan_db}
      DB_LEDGER_USER: ${POSTGRES_USER:-almizan_user}
      DB_LEDGER_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      DB_READ_NAME: ${POSTGRES_DB:-almizan_db}
      DB_READ_USER: ${POSTGRES_USER:-almizan_user}
      DB_READ_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      INTERNAL_BASE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-900}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@almizan.local}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin_almizan}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-SecurePassword123!}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-almizan-documents}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_ROLE: ${INITIAL_ADMIN_ROLE:-admin}
      INITIAL_ADMIN_MEMBRE_ID: ${INITIAL_ADMIN_MEMBRE_ID:-1}
      #GEMINI_API_KEY: ${GEMINI_API_KEY}
      #GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-2000}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-3}
      GROQ_RETRY_BASE_DELAY: ${GROQ_RETRY_BASE_DELAY:-5.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      create_bucket:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  celery:
    profiles: ["worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ../backend:/app
    command: ["sh", "-c", "celery -A config worker -l info"]
    environment:
      PORT: 8000
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-unsafe-dev-secret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-almizan_db}
      DB_USER: ${POSTGRES_USER:-almizan_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      DB_LEDGER_NAME: ${POSTGRES_DB:-almizan_db}
      DB_LEDGER_USER: ${POSTGRES_USER:-almizan_user}
      DB_LEDGER_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      DB_READ_NAME: ${POSTGRES_DB:-almizan_db}
      DB_READ_USER: ${POSTGRES_USER:-almizan_user}
      DB_READ_PASSWORD: ${POSTGRES_PASSWORD:-almizan_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-almizan_redis_password}@redis:6379/0
      INTERNAL_BASE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-900}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@almizan.local}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin_almizan}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-SecurePassword123!}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-almizan-documents}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

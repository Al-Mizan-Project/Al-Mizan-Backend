# Shared Infrastructure for Al-Mizan Backend
# Start this FIRST before any service: docker compose up -d

services:
  shared_postgres:
    image: postgres:16-alpine
    container_name: almizan_shared_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-almizan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-almizan_admin_password}
      POSTGRES_DB: postgres
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-almizan_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - almizan-infra

  shared_redis:
    image: redis:7.4-alpine
    container_name: almizan_shared_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-almizan_redis_password}"]
    volumes:
      - shared-redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-almizan_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - almizan-infra

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: almizan_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@almizan.dz}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      shared_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - almizan-infra

volumes:
  shared-postgres-data:
  shared-redis-data:

networks:
  almizan-infra:
    name: almizan-infra
    driver: bridge
